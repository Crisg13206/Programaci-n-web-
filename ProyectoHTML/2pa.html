<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RF01 - Verificación de Dos Pasos</title>
</head>
<body>

    <header>
        <h1>Plataforma Educativa</h1>
    </header>

    <main>
        <section>
            <h2>Paso 2: Verificación de Seguridad</h2>
            <p>Hemos enviado un código de 6 dígitos a tu correo o aplicación de autenticación.</p>

            <!-- Al ingresar el código correcto, redirige al sistema principal -->
            <form action="dashboard.html" method="post">
                <fieldset>
                    <legend>Código de Verificación</legend>

                    <p>
                        <label for="codigo-2fa">Ingresa el código (6 dígitos):</label><br>
                        <input 
                            type="text" 
                            id="codigo-2fa" 
                            name="codigo_2fa" 
                            maxlength="6" 
                            pattern="[0-9]{6}" 
                            inputmode="numeric" 
                            placeholder="123456" 
                            required 
                            autocomplete="one-time-code">
                    </p>

                    <p>
                        <button type="submit">Verificar e Ingresar</button>
                    </p>
                </fieldset>
            </form>

            <!-- Opciones secundarias del flujo -->
            <nav aria-label="Opciones de soporte 2FA">
                <ul>
                    <li><a href="#">¿No recibiste el código? Reenviar código</a></li>
                    <li><a href="login.html">Volver al inicio de sesión</a></li>
                </ul>
            </nav>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Equipo 2</p>
    </footer>

</body>
</html>
